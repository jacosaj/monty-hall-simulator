name: Deploy Monty Hall Simulator to GitHub Pages

on:
  # Uruchom przy push do main
  push:
    branches: [ main ]
  
  # Pozwól na ręczne uruchomienie
  workflow_dispatch:

# Uprawnienia do zapisywania w Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Pozwól tylko na jeden deployment na raz
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Job budowania
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build project
      run: npm run build
    
    - name: Setup Pages
      uses: actions/configure-pages@v4
    
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './dist'

  # Job deploymentu
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4